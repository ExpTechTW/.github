name: Org Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  USER: ExpTechTW
  TIMEZONE: Asia/Taipei
  BRANCH: main

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # ═══════════════════════════════════════════════════════════════
      # 核心指標
      # ═══════════════════════════════════════════════════════════════

      # 1. 組織基本資訊
      - name: 📊 Base
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # = @latest (v3.34), pinned 2026-11-21; image ghcr.io/lowlighter/metrics:v3.34
        with:
          token: ${{ secrets.PAT_CLASSIC_TOKEN }}
          output_action: commit
          committer_branch: ${{ env.BRANCH }}
          user: ${{ env.USER }}
          config_timezone: ${{ env.TIMEZONE }}
          filename: profile/metrics.base.svg
          base: header, activity, community, repositories

      # 2. 語言統計
      - name: 💻 Languages
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # = @latest (v3.34), pinned 2026-11-21; image ghcr.io/lowlighter/metrics:v3.34
        with:
          token: ${{ secrets.PAT_CLASSIC_TOKEN }}
          output_action: commit
          committer_branch: ${{ env.BRANCH }}
          user: ${{ env.USER }}
          config_timezone: ${{ env.TIMEZONE }}
          filename: profile/metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          plugin_languages_other: yes
          plugin_languages_analysis_timeout: 30

      # ═══════════════════════════════════════════════════════════════
      # 組織成員與專案
      # ═══════════════════════════════════════════════════════════════

      # 3. 成員
      - name: 👥 Members
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # = @latest (v3.34), pinned 2026-11-21; image ghcr.io/lowlighter/metrics:v3.34
        with:
          token: ${{ secrets.PAT_CLASSIC_TOKEN }}
          output_action: commit
          committer_branch: ${{ env.BRANCH }}
          user: ${{ env.USER }}
          config_timezone: ${{ env.TIMEZONE }}
          filename: profile/metrics.people.svg
          base: ""
          plugin_people: yes
          plugin_people_types: members
          plugin_people_limit: 24
          plugin_people_size: 28

      # 4. 精選專案
      - name: 📦 Repositories
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # = @latest (v3.34), pinned 2026-11-21; image ghcr.io/lowlighter/metrics:v3.34
        with:
          token: ${{ secrets.PAT_CLASSIC_TOKEN }}
          output_action: commit
          committer_branch: ${{ env.BRANCH }}
          user: ${{ env.USER }}
          config_timezone: ${{ env.TIMEZONE }}
          filename: profile/metrics.repositories.svg
          base: ""
          plugin_repositories: yes
          plugin_repositories_featured: ExpTechTW/TREM-tauri, ExpTechTW/DPIP

      # ═══════════════════════════════════════════════════════════════
      # 統計
      # ═══════════════════════════════════════════════════════════════

      # 5. 星星歷史
      - name: ⭐ Stargazers
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # = @latest (v3.34), pinned 2026-11-21; image ghcr.io/lowlighter/metrics:v3.34
        with:
          token: ${{ secrets.PAT_CLASSIC_TOKEN }}
          output_action: commit
          committer_branch: ${{ env.BRANCH }}
          user: ${{ env.USER }}
          config_timezone: ${{ env.TIMEZONE }}
          filename: profile/metrics.stargazers.svg
          base: ""
          plugin_stargazers: yes
          plugin_stargazers_charts_type: classic

      # 6. Issue/PR 追蹤
      - name: 🔄 Follow-up
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # = @latest (v3.34), pinned 2026-11-21; image ghcr.io/lowlighter/metrics:v3.34
        with:
          token: ${{ secrets.PAT_CLASSIC_TOKEN }}
          output_action: commit
          committer_branch: ${{ env.BRANCH }}
          user: ${{ env.USER }}
          config_timezone: ${{ env.TIMEZONE }}
          filename: profile/metrics.followup.svg
          base: ""
          plugin_followup: yes
          plugin_followup_sections: repositories

      # 7. 組織簡介
      - name: 👋 Introduction
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # = @latest (v3.34), pinned 2026-11-21; image ghcr.io/lowlighter/metrics:v3.34
        with:
          token: ${{ secrets.PAT_CLASSIC_TOKEN }}
          output_action: commit
          committer_branch: ${{ env.BRANCH }}
          user: ${{ env.USER }}
          config_timezone: ${{ env.TIMEZONE }}
          filename: profile/metrics.introduction.svg
          base: ""
          plugin_introduction: yes
          plugin_introduction_title: yes

